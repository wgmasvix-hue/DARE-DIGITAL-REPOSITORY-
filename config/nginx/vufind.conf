# Nginx configuration for VuFind DARE
# Reverse proxy for VuFind application

upstream vufind_app {
    server vufind:80;
}

upstream solr_app {
    server solr:8983;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name vufind.dare.co.zw;

    # Allow Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /tmp/letsencrypt;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    server_name vufind.dare.co.zw;

    # SSL certificates (mount from certs volume)
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' data: https:;" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/xml+rss
               application/atom+xml image/svg+xml;
    gzip_min_length 1024;

    # Client upload size limit
    client_max_body_size 100m;

    # Root for VuFind public directory
    root /usr/local/vufind/public;

    # Logging
    access_log /var/log/nginx/vufind_access.log combined;
    error_log /var/log/nginx/vufind_error.log warn;

    # ========================================================================
    # VuFind Application Proxy
    # ========================================================================

    location / {
        try_files $uri $uri/ @vufind;
    }

    location @vufind {
        proxy_pass http://vufind_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_redirect http:// https://;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ========================================================================
    # Static Files (Optimized Caching)
    # ========================================================================

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ========================================================================
    # VuFind Specific Paths
    # ========================================================================

    # Search API
    location /api/ {
        proxy_pass http://vufind_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Authentication endpoints
    location /Auth/ {
        proxy_pass http://vufind_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /Auth;
    }

    # Search endpoints
    location /Search/ {
        proxy_pass http://vufind_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Record detail page
    location /Record/ {
        proxy_pass http://vufind_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========================================================================
    # Solr Proxy (for advanced queries)
    # ========================================================================

    location /solr/ {
        # Restrict access to localhost only
        allow 127.0.0.1;
        allow 172.16.0.0/12;  # Docker internal network
        deny all;

        proxy_pass http://solr_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ========================================================================
    # Health Check
    # ========================================================================

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location /healthz {
        access_log off;
        proxy_pass http://vufind_app/index.php/;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # ========================================================================
    # Block Access to Sensitive Files
    # ========================================================================

    location ~ /\.ht {
        deny all;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /config/ {
        deny all;
    }

    location ~ /logs/ {
        deny all;
    }

    # ========================================================================
    # Rate Limiting
    # ========================================================================

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=search_limit:10m rate=30r/s;

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
    }

    location /Search/ {
        limit_req zone=search_limit burst=50 nodelay;
    }
}

# ============================================================================
# HTTP/2 Server Push and Performance
# ============================================================================

# Enable HTTP/2 push for critical resources (in server block)
# push /css/style.css;
# push /js/app.js;
