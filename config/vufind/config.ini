; VuFind Configuration for DARE Digital Repository
;
; This file contains core settings for VuFind search and discovery
;

; ============================================================================
; Search Settings
; ============================================================================
[Index]
; Search engine type
engine = Solr

; Solr URL
url = http://solr:8983/solr/biblio

; Solr version (for compatibility)
version = 8

; Default sort order
default_sort = relevance

; Maximum number of results per page
limit = 20

; Maximum allowed limit parameter
max_limit = 100

; Default facets to display
facet_limit = 20

[Search]
; Default search type for basic search
default_type = AllFields

; Enable advanced search
advanced = true

; Enable saved searches
saved = true

; Enable search history
history = true

; Number of previous searches to remember
history_limit = 20

; Enable search recommendations
spellcheck = true

; Enable "Did you mean?"
enabled = true

; ============================================================================
; OAI-PMH Harvesting
; ============================================================================
[OAI]
; Enable OAI harvesting
enabled = true

; OAI indexing enabled
indexing = true

; DSpace OAI endpoint
url = http://repo.dare.co.zw/oai/request

; Repository name
repository_name = DARE DSpace Repository

; Harvest metadata in Dublin Core format
metadata_format = oai_dc

; Refresh harvest interval (seconds)
refresh_interval = 86400

; ============================================================================
; Authentication
; ============================================================================
[Authentication]
; Authentication method
method = ORCID

; ORCID settings
[ORCID]
enabled = true
; Client ID from ORCID (set via environment variable)
; client_id = ${ORCID_CLIENT_ID}
; client_secret = ${ORCID_CLIENT_SECRET}
api_url = https://pub.orcid.org
; For sandbox: https://sandbox.orcid.org

; DSpace integration
[DSpace]
enabled = true
url = http://repo.dare.co.zw
rest_api = http://repo.dare.co.zw/rest
; Support user login via DSpace
login_enabled = true

; ============================================================================
; Display Settings
; ============================================================================
[Site]
; Site title
title = DARE Digital Repository

; Site URL
url = http://vufind.dare.co.zw

; Default theme
theme = foundation

; Language
language = en

; Timezone
timezone = Africa/Harare

[Branding]
; Show search box on homepage
show_search_home = true

; Show advanced search link
show_advanced_search = true

; Show facets
show_facets = true

; Facet location (left, right, top, bottom)
facet_location = left

[Banner]
; Show banner message
show_banner = true
banner_message = "Welcome to DARE: Discover Africa's Research Excellence"

; ============================================================================
; Result Display
; ============================================================================
[ResultsView]
; Default results view
view = list

; Available views (comma-separated)
views = list,grid

; Fields to display in results
result_fields[] = title
result_fields[] = author_display
result_fields[] = publisher
result_fields[] = publishDate
result_fields[] = description

[RecordView]
; Fields to display in detail view
detail_fields[] = title
detail_fields[] = author_display
detail_fields[] = subject
detail_fields[] = publisher
detail_fields[] = publishDate
detail_fields[] = description
detail_fields[] = rights
detail_fields[] = language
detail_fields[] = format

; Show availability
show_availability = true

; Show similar records
show_similar = true

; ============================================================================
; Social Features
; ============================================================================
[Social]
; Enable user accounts
enabled = true

; Enable comments
comments_enabled = true

; Enable ratings
ratings_enabled = true

; Enable favorites/saving records
favorites_enabled = true

; Enable sharing
sharing_enabled = true

; Social sharing options
share_twitter = true
share_facebook = true
share_email = true

; ============================================================================
; API Settings
; ============================================================================
[API]
; Enable VuFind API
enabled = true

; API key required
require_key = false

; API Documentation URL
doc_url = http://vufind.dare.co.zw/api/

[CORS]
; Cross-Origin Resource Sharing
enabled = true
allowed_origins[] = *

; ============================================================================
; Caching
; ============================================================================
[Caching]
; Cache type (file, apc, memcached)
type = file

; Cache directory
directory = /usr/local/vufind/cache

; Cache TTL (Time To Live) in seconds
ttl = 3600

; Cache facets
cache_facets = true

[Memcached]
; Memcached server (if using memcached)
; host = memcached
; port = 11211

; ============================================================================
; Logging
; ============================================================================
[Logging]
; Log level (DEBUG, INFO, WARN, ERROR)
level = WARN

; Log file
file = /usr/local/vufind/logs/vufind.log

; Log size before rotation
max_size = 10M

; Keep this many log files
backup_count = 5

; ============================================================================
; Quality Assurance
; ============================================================================
[QA]
; Enable debug mode
debug = false

; Show timing information
show_timings = false

; Enable error reporting
error_reporting = true

; Log all queries
log_queries = false

; ============================================================================
; Integration with ChengetAi Labs
; ============================================================================
[ChengetAi]
; Enable AI features
enabled = true

; AI API endpoint
api_url = https://api.chengetai.com

; API key (set via environment variable)
; api_key = ${CHENGETAI_API_KEY}

; AI-powered search enhancement
search_enhancement = true

; AI recommendations
recommendations = true

; AI metadata tagging
auto_tagging = true

; AI content classification
auto_classification = true

; ============================================================================
; Analytics (Matomo Integration)
; ============================================================================
[Analytics]
; Enable Matomo tracking
enabled = true

; Matomo server URL
server_url = http://matomo.dare.co.zw

; Matomo site ID
site_id = 1

; Track all events
track_events = true

; Track API calls
track_api = true

; Track search queries (privacy: anonymized)
track_searches = true

; Anonymize IP addresses (GDPR compliance)
anonymize_ip = true

; ============================================================================
; Security
; ============================================================================
[Security]
; HTTPS enforcement
https_only = true

; HSTS (HTTP Strict Transport Security)
hsts_enabled = true
hsts_max_age = 31536000

; Content Security Policy
csp_enabled = true

; X-Frame-Options
frame_options = SAMEORIGIN

; X-Content-Type-Options
content_type_options = nosniff

; X-XSS-Protection
xss_protection = "1; mode=block"

; Referrer Policy
referrer_policy = strict-origin-when-cross-origin
