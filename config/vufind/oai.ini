;
; OAI-PMH Harvester Configuration for DSpace Integration
;
; This configuration tells VuFind how to harvest metadata from DSpace
; via the OAI-PMH (Open Archives Initiative Protocol for Metadata Harvesting)
;

[General]
; OAI-PMH Base URL for DSpace
url = http://repo.dare.co.zw/oai/request

; Metadata prefix to harvest (oai_dc = Dublin Core)
metadataPrefix = oai_dc

; Set to harvest (empty = all sets)
; Examples: com_123456_7, hdl_123456_789
set =

; Harvest from this date (ISO 8601 format)
; Leave empty to harvest all records
; from_date = 2024-01-01

; Resumption token for continuing interrupted harvests
resumptionToken =

; Maximum records to fetch per OAI request
batchSize = 100

; Enable incremental harvesting (only new/modified records since last run)
incremental = true

[DSpace]
; Human-readable repository name
name = DARE DSpace Repository

; Repository base URL (for generating item links)
repository = http://repo.dare.co.zw

; OAI identifier format (prefix used in OAI IDs)
; Usually oai:hostname:handle or similar
identifier_format = oai:repo.dare.co.zw

; DSpace Handle prefix (if using handles)
; Example: 123456789
handle_prefix =

[Solr]
; Solr server details
solr_hostname = localhost
solr_port = 8983

; Solr core name
core = biblio

; Timeout for Solr operations
timeout = 30

[Harvesting]
; How often to re-harvest in seconds
; 3600 = 1 hour
; 86400 = 1 day (recommended)
; 604800 = 1 week
interval = 86400

; Parallel requests to DSpace
parallel_requests = 3

; Log file location
logfile = /usr/local/vufind/logs/harvest_oai.log

; Archive harvested records
archive = true

; Archive location
archive_dir = /usr/local/vufind/harvest/archive

[Linking]
; Generate direct links to DSpace items
generate_deep_links = true

; Link format:
; {handle} = Replace with DSpace handle
; {id} = Replace with OAI ID
link_format = http://repo.dare.co.zw/handle/{handle}

[Metadata]
; Map OAI Dublin Core fields to Solr fields
; Format: solr_field = oai_element

; Standard Dublin Core mappings
title_mapping = dc:title
author_mapping = dc:creator
subject_mapping = dc:subject
description_mapping = dc:description
publisher_mapping = dc:publisher
date_mapping = dc:issued|dc:date
type_mapping = dc:type
format_mapping = dc:format
identifier_mapping = dc:identifier
language_mapping = dc:language
rights_mapping = dc:rights
coverage_mapping = dc:coverage
source_mapping = dc:source
relation_mapping = dc:relation

; Custom DARE mappings
institution_mapping = dc:source
collection_mapping = dc:coverage
orcid_mapping = dc:creator.orcid

[Filtering]
; Filter records by content type
; Example: filter_type[] = text
; filter_type[] = image
; filter_type[] = audio

; Exclude certain item types
; exclude_type = restricted
; exclude_type = temporary

; Only harvest items with these statuses
; include_status = published
; include_status = archived

[Quality]
; Validate harvested records
validate_xml = true

; Require certain fields (comma-separated)
required_fields = dc:title,dc:creator

; Minimum length for fields (in characters)
min_title_length = 3
min_description_length = 10

; Skip records with missing required fields
skip_incomplete = false

; Maximum number of errors before stopping
max_errors = 100

[Notifications]
; Email notifications on harvest completion
send_email = false
email_to = admin@dare.co.zw
email_on_error = true
email_on_success = false

; Slack notifications
send_slack = false
slack_webhook_url = https://hooks.slack.com/services/YOUR/WEBHOOK/URL
