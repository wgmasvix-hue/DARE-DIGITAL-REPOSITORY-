version: '3.8'

services:
  # Ollama LLM Engine
  ollama:
    image: ollama/ollama:latest
    container_name: rosersg-ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - rosersg-network
    restart: unless-stopped

  # rosersg API (Phase 1: RAG Core)
  rosersg-api:
    build:
      context: .
      dockerfile: Dockerfile.phase1
    container_name: rosersg-api
    ports:
      - "5000:5000"
    environment:
      - OLLAMA_ENDPOINT=http://ollama:11434
      - OLLAMA_MODEL=mistral
      - DSPACE_ENDPOINT=https://repo.dare.co.zw
      - ROSERSG_API_KEY=${ROSERSG_API_KEY:-your-secure-api-key}
      - FLASK_ENV=production
      - DEBUG=false
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - rosersg-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Uncomment to mount for development:
    # volumes:
    #   - ./rosersg:/app/rosersg
    #   - ./docker-entrypoint.sh:/app/docker-entrypoint.sh

  # rosersg UI (React)
  rosersg-ui:
    image: node:18-alpine
    container_name: rosersg-ui
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./ui:/app
    command: sh -c "npm install && npm start"
    networks:
      - rosersg-network
    environment:
      - REACT_APP_API_URL=https://repo.dare.co.zw/ai-api
      - REACT_APP_API_KEY=${ROSERSG_API_KEY:-your-secure-api-key}
      - PUBLIC_URL=/ai
    depends_on:
      - rosersg-api
    restart: unless-stopped

volumes:
  ollama_data:
    driver: local

networks:
  rosersg-network:
    driver: bridge
