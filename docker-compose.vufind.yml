version: '3.8'

services:
  # Solr Search Engine for VuFind
  solr:
    image: solr:8.11-slim
    container_name: dare-vufind-solr
    ports:
      - "8983:8983"
    environment:
      - SOLR_HEAP=2g
      - SOLR_OPTS=-Dsolr.disable.configEdit=true
    volumes:
      - solr-data:/var/solr
      - ./config/solr/schema.xml:/tmp/schema.xml
    networks:
      - dare-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8983/solr/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # VuFind Discovery Layer
  vufind:
    image: vufind/vufind:9.0
    container_name: dare-vufind
    ports:
      - "8080:80"
    environment:
      - VUFIND_URL=http://vufind.dare.co.zw
      - VUFIND_CONFIG_PATH=/usr/local/vufind/config
      - SOLR_HOSTNAME=solr
      - SOLR_PORT=8983
      - DSPACE_URL=http://repo.dare.co.zw
      - DSPACE_OAI_URL=http://repo.dare.co.zw/oai/request
      - ORCID_CLIENT_ID=${ORCID_CLIENT_ID:-}
      - ORCID_CLIENT_SECRET=${ORCID_CLIENT_SECRET:-}
    volumes:
      # Configuration
      - ./config/vufind/oai.ini:/usr/local/vufind/local/oai.ini
      - ./config/vufind/config.ini:/usr/local/vufind/local/config.ini
      - ./config/vufind/searches.ini:/usr/local/vufind/local/searches.ini

      # Harvest cache and data
      - vufind-data:/usr/local/vufind/harvest
      - vufind-logs:/usr/local/vufind/logs

      # Custom mappings
      - ./config/vufind/dareDublinCore.php:/usr/local/vufind/local/dareDublinCore.php
    depends_on:
      solr:
        condition: service_healthy
    networks:
      - dare-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/index.php/"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Nginx Reverse Proxy for VuFind
  nginx-vufind:
    image: nginx:alpine
    container_name: dare-vufind-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/vufind.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./config/nginx/ssl.conf:/etc/nginx/ssl.conf:ro
    depends_on:
      - vufind
    networks:
      - dare-network
    restart: unless-stopped

volumes:
  solr-data:
    driver: local
  vufind-data:
    driver: local
  vufind-logs:
    driver: local

networks:
  dare-network:
    driver: bridge
