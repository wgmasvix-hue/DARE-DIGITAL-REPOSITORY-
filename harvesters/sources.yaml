# ---------------------------------------------------------------------------
# DARE harvest sources
#
# `verified: true` means probe_sources.py issued a real OAI-PMH Identify
# request against that endpoint and got a valid response back. Anything marked
# false has NOT been confirmed and must not be harvested: a wrong base URL
# usually returns an HTML 404 that a naive parser reads as zero records and
# reports as a successful, empty run.
#
#     python3 probe_sources.py --config sources.yaml            # check all
#     python3 probe_sources.py --config sources.yaml --write    # record results
#     python3 probe_sources.py --config sources.yaml --only uz --timeout 60
#
# OAI paths differ by platform:
#     DSpace 7/8/9   /server/oai/request
#     DSpace 5/6     /oai/request
#     DSpace JSPUI   /jspui/oai/request
#     OJS            /index.php/index/oai
#     Invenio        /oai2d
# ---------------------------------------------------------------------------

defaults:
  metadata_prefix: oai_dc
  timeout: 45
  batch_size: 100
  # Institutional repositories in the region often run on modest hardware, and
  # an aggressive harvester is indistinguishable from an attack.
  delay_between_requests: 1.0
  user_agent: "DARE-Harvester/1.0 (+https://dare.co.zw; repository@dare.co.zw)"


# --- Zimbabwean institutional repositories ---------------------------------
# The highest-value set for DARE: this material is frequently indexed nowhere
# else, which is the gap a national repository exists to close.

zimbabwe:
  cut:
    name: "Chinhoyi University of Technology"
    host: "https://ir.cut.ac.zw"
    oai_path: "/oai/request"
    verified: true              # confirmed: "CUT IR", DSpace 5/6
    collection: null            # DARE collection handle — set before importing

  buse:
    name: "Bindura University of Science Education"
    host: "https://ir.buse.ac.zw"
    oai_path: "/server/oai/request"
    verified: true              # confirmed: "BUSE Research Repository", DSpace 7+
    collection: null

  uz:
    name: "University of Zimbabwe Institutional Repository (eScholar)"
    host: "https://ir.uz.ac.zw"
    # Listed in OpenDOAR 1760 and ROAR 15523. Public links use /jspui/, so the
    # OAI endpoint is most likely under that prefix rather than at the root.
    oai_path: "/jspui/oai/request"
    verified: false             # probe returned ConnectionError over HTTPS
    collection: null

  nust:
    name: "National University of Science and Technology"
    host: "https://ir.nust.ac.zw"
    verified: false             # probe timed out at 20s — retry with --timeout 60
    collection: null

  msu:
    name: "Midlands State University"
    host: "https://ir.msu.ac.zw"
    verified: false             # probe timed out at 20s — retry with --timeout 60
    collection: null

  gzu:
    name: "Great Zimbabwe University"
    host: "https://ir.gzu.ac.zw"
    verified: false             # probe timed out at 20s — retry with --timeout 60
    collection: null

  hit:
    name: "Harare Institute of Technology"
    host: "https://ir.hit.ac.zw"
    verified: false             # probe returned ConnectionError
    collection: null

  africau:
    name: "Africa University"
    host: "https://ir.africau.edu"
    verified: false             # probe returned ConnectionError — host may differ
    collection: null

  zou:
    name: "Zimbabwe Open University (ZOU SPACE)"
    host: "https://zouspace.zou.ac.zw"
    verified: false             # not yet probed
    collection: null


# --- African and regional aggregators --------------------------------------

africa:
  ajol:
    name: "African Journals OnLine"
    host: "https://www.ajol.info"
    oai_path: "/index.php/index/oai"
    verified: true              # confirmed: "African Journals Online", OJS
    collection: null

  zenodo_africa:
    name: "Zenodo"
    host: "https://zenodo.org"
    oai_path: "/oai2d"
    # Zenodo is vast. Harvest by community or set only, never wholesale.
    require_set: true
    verified: true              # confirmed
    collection: null


# --- International ----------------------------------------------------------

international:
  mit:
    name: "MIT Open Scholarship"
    host: "https://dspace.mit.edu"
    oai_path: "/server/oai/request"
    verified: true              # confirmed: "MIT Open Scholarship", DSpace 7+
    collection: null


# --- Policy -----------------------------------------------------------------
# Not decoration. These constrain what the importer is allowed to do.

policy:
  # Harvested records go to their own collection, never mixed with local
  # deposits. A visitor must be able to tell what DARE holds from what DARE
  # merely indexes — and so must any aggregator harvesting DARE in turn.
  separate_collection: true

  # Metadata only. Do not fetch full-text bitstreams without checking each
  # source's licence terms; OAI-PMH exposes metadata for reuse, which says
  # nothing about the files behind it.
  metadata_only: true

  # Every imported record carries dc.source, dc.relation.uri and a provenance
  # note naming the origin. Enforced in saf_builder.py, not optional.
  require_provenance: true
