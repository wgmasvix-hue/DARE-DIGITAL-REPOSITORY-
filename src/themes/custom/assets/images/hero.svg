<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="dareBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2940"/>
      <stop offset="0.55" stop-color="#123B5D"/>
      <stop offset="1" stop-color="#1A4D75"/>
